name: wooberly_driver
description: A Wooberly Driver Flutter project
version: 3.5.0
flutter_sdk version: 3.47.2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  provider: ^6.1.5+1
  graphql_flutter: ^5.3.0
  permission_handler: ^13.0.1
  flutter_svg: ^2.3.0
  connectivity_plus: ^7.1.1
  google_maps_flutter_platform_interface: ^2.15.0
  google_maps_flutter_android: ^2.19.12
  google_maps_flutter_ios_sdk10: ^2.18.4
  socket_io_client: ^3.1.4
  cached_network_image: ^4.0.0
  url_launcher: 6.3.2
  geocoding: ^5.0.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.0.1
  firebase_crashlytics: ^5.3.0
  lottie: ^3.3.3
  flutter_widget_from_html_core: ^0.17.2
  intl: ^0.20.3
  just_the_tooltip: 0.0.12
  camera: ^0.12.0+1
  image: ^4.8.0
  file_picker: ^12.1.3
  webview_flutter: ^4.13.1
  webview_flutter_wkwebview: ^3.25.1
  json_annotation: ^4.12.0
  video_player: ^2.11.1
  audio_session: 0.2.4
  video_player_android: ^2.9.6
  customization:
    path: ./customization/
  record: ^7.1.1
  uuid: ^4.6.0
  just_audio: ^0.10.5
  flutter_localizations:
    sdk: flutter
  get: ^4.7.3
  camera_android: ^0.10.10+17
  cryptography: ^2.9.0
  age_range_signals: ^0.8.0



dev_dependencies:
  flutter_test:
    sdk: flutter

dependency_overrides:
  age_range_signals:
    path: third_party/age_range_signals-0.8.0
    # remove this plugin after age_range_signals provide support for KGP


flutter:
  config:
    enable-swift-package-manager: true

  uses-material-design: true

  assets:
    - res/
    - res/drawable/
    - res/drawable/flags/
    - res/graphql/
    - assets/map_style.txt
    - assets/lottieloader.json
    - assets/ride_request.mp3
    - assets/video.mp4
    - assets/lottieloader_dark.json
    - assets/map_style_dark.txt
    - android/local.properties

  fonts:
    - family: HindVadodara
      fonts:
        - asset: font/HindVadodara-Regular.ttf
          weight: 400
        - asset: font/HindVadodara-Medium.ttf
          weight: 500
        - asset: font/HindVadodara-SemiBold.ttf
          weight: 600