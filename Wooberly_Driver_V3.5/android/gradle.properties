kotlin.mpp.stability.nowarn=false
kotlin.warnings.nowarn=false

# Optional: Raise the logging level for Gradle
org.gradle.logging.level=lifecycle

# Enable R8 Full Mode for maximum shrinking, inlining, and obfuscation
android.enableR8.fullMode=true


