org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2048m --add-opens java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
android.enableJetifier=true

# Flutter AGP/Kotlin integration flags (required by flutter_tools/gradle)
android.builtInKotlin=true
android.newDsl=false

# JDK 24 native access for Kotlin daemon
