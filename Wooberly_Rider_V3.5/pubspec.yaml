name: app_name
description: A APP_NAME Flutter project
version: 1.0.0
flutter_sdk_version: 3.47.2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  get: ^4.7.3
  provider: ^6.1.5+1
  graphql_flutter: ^5.3.0
  flutter_svg: ^2.3.0
  google_maps_flutter_platform_interface: ^2.15.0
  google_maps_flutter_android: ^2.19.12
  google_maps_flutter_ios_sdk10: ^2.18.4
  socket_io_client: ^3.1.4
  cached_network_image: ^4.0.0
  permission_handler: ^13.0.1
  url_launcher: ^6.3.2
  geocoding: ^5.0.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.0.1
  firebase_crashlytics: ^5.3.0
  lottie: ^3.3.3
  flutter_widget_from_html_core: ^0.17.2
  intl: ^0.20.2
  just_the_tooltip: ^0.0.12
  camera: ^0.12.0+1
  camera_android: ^0.10.10+17
  file_picker: ^12.1.2
  webview_flutter: ^4.13.1
  webview_flutter_wkwebview: ^3.25.1
  geolocator_platform_interface: ^4.2.6
  geolocator_android: ^5.0.2
  geolocator_apple: ^2.3.13
  video_player: ^2.11.1
  flutter_stripe: ^14.0.0
  dotted_border: ^3.1.0
  pay_android: ^3.2.0
  pay_platform_interface: ^2.0.0
  image: ^4.8.0
  connectivity_plus: ^7.1.1
  just_audio: ^0.10.6
  video_player_android: ^2.9.6
  record: ^7.1.1
  cryptography: ^2.9.0
  uuid: ^4.6.0
  age_range_signals: ^0.8.0
  customization:
    path: ./customization/

dev_dependencies:
  flutter_test:
    sdk: flutter

dependency_overrides:
  pay_android:
    path: third_party/pay_android-3.2.0
    # remove this plugin after pay_android provide support for KGP

  age_range_signals:
    path: third_party/age_range_signals-0.8.0
    # remove this plugin after age_range_signals provide support for KGP



flutter:
  config:
    enable-swift-package-manager: true

  uses-material-design: true

  assets:
    - res/drawable/
    - res/drawable/pickup_pin.png
    - res/graphql/
    - res/drawable/flags/
    - assets/
    - assets/map_style.txt
    - assets/map_style_dark.txt
    - assets/lottieloader.json
    - assets/schedule_success.json
    - assets/scheduling_loader.json
    - assets/lottie_connecting_driver.gif
    - assets/lottieloader_dark.json
    - assets/scheduling_loader_dark.json

  fonts:
    - family: HindVadodara
      fonts:
        - asset: font/HindVadodara-Regular.ttf
          weight: 400
        - asset: font/HindVadodara-Medium.ttf
          weight: 500
        - asset: font/HindVadodara-SemiBold.ttf
          weight: 600
