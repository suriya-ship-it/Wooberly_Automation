org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2048m --add-opens java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
android.enableJetifier=true

# Flutter AGP/Kotlin integration flags (required by flutter_tools/gradle)
android.builtInKotlin=true
android.newDsl=false

# JDK 24 native access for Kotlin daemon
kotlin.daemon.jvmargs=-Dkotlin.daemon.jvm.options=--enable-native-access=ALL-UNNAMED

kotlin.mpp.stability.nowarn=false
kotlin.warnings.nowarn=false

# Optional: Raise the logging level for Gradle
org.gradle.logging.level=lifecycle

# Bypass AGP validation check in Flutter
flutter.androidSkipBuildDependencyValidation=true
